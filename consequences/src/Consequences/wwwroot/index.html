<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e4572e">
  <meta name="description" content="Play the classic folded-paper game Consequences online with friends, with drawing!">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Consequences</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="logo" id="logo" title="Home">Conse<span>q</span>uences</div>
      <div class="spacer"></div>
      <span id="room-chip" class="tag" hidden></span>
      <button class="icon-btn" id="btn-help" title="How to play" aria-label="How to play">❓</button>
      <button class="icon-btn" id="btn-sound" title="Sound on/off" aria-label="Sound on or off">🔔</button>
      <button class="icon-btn" id="btn-theme" title="Light/dark" aria-label="Switch theme">🌓</button>
    </header>
    <main id="view" aria-live="polite"></main>
  </div>

  <button class="chat-fab" id="chat-fab" hidden aria-label="Chat">💬<span class="badge" hidden>0</span></button>
  <section class="chat" id="chat" hidden aria-label="Room chat">
    <header><span>💬 Room chat</span><button class="icon-btn" id="chat-close" aria-label="Close chat">✕</button></header>
    <div class="msgs" id="chat-msgs"></div>
    <form id="chat-form" autocomplete="off"><input type="text" id="chat-input" maxlength="300" placeholder="Say something…" aria-label="Chat message"><button class="btn sm teal">Send</button></form>
  </section>

  <div id="toasts" role="status"></div>
  <div class="conn-banner" id="conn-banner" hidden>Reconnecting… 📡</div>

  <script src="lib/signalr.min.js"></script>
  <script src="lib/qrcode.js"></script>
  <script src="js/draw.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
