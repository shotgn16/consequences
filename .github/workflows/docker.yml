# Builds multi-arch images to GHCR:
#   ghcr.io/<owner>/consequences            (multi-arch, for Docker)
#   ghcr.io/<owner>/consequences-<arch>     (per arch, for the Home Assistant `image:` option)
name: Build images
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { arch: amd64,   platform: linux/amd64 }
          - { arch: aarch64, platform: linux/arm64 }
          - { arch: armv7,   platform: linux/arm/v7 }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: |
          echo "version=$(grep '^version:' consequences/config.yaml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./consequences
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ steps.v.outputs.owner }}/consequences-${{ matrix.arch }}:${{ steps.v.outputs.version }}
            ghcr.io/${{ steps.v.outputs.owner }}/consequences-${{ matrix.arch }}:latest

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - run: |
          o=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}
          v=$(grep '^version:' consequences/config.yaml | cut -d'"' -f2)
          for t in "$v" latest; do
            docker buildx imagetools create -t $o/consequences:$t \
              $o/consequences-amd64:$t $o/consequences-aarch64:$t $o/consequences-armv7:$t
          done
